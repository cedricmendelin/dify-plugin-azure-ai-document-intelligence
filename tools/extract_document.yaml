identity:
  name: extract_document
  author: cedricmendelin
  label:
    en_US: Extract Document
    ja_JP: ドキュメントの展開
description:
  human:
    en_US: Extract Document/Image File to Text/Markdown
    ja_JP: ドキュメント/画像をテキストまたはMarkdownに展開
  llm: This tool extract document or image file to text or markdown format.
parameters:
  - name: input_file
    type: file
    required: true
    label:
      en_US: Document/Image File
      ja_JP: ドキュメント/画像ファイル
    human_description:
      en_US: The document/image file to extract. Supported file type is PDF, JPEG, JPG, PNG, BMP, TIFF, HEIF, DOCX, XLSX, PPTX, HTML.
      ja_JP: 展開するドキュメント/画像ファイル。対応形式は PDF, JPEG, JPG, PNG, BMP, TIFF, HEIF, DOCX, XLSX, PPTX, HTML です。
    llm_description: The document/image file to extract. Supported file type is PDF, JPEG, JPG, PNG, BMP, TIFF, HEIF, DOCX, XLSX, PPTX, HTML.
    form: llm
  - name: output_format
    type: select
    required: true
    label:
      en_US: Output format
      ja_JP: 出力フォーマット
    human_description:
      en_US: Select output format.
      ja_JP: 出力フォーマットを選択します。
    llm_description: Output format. Select text or markdown.
    form: form
    options:
      - value: text
        label:
          en_US: Text
          ja_JP: テキスト
      - value: markdown
        label:
          en_US: Markdown
          ja_JP: Markdown
    default: text
  - name: page_ranges
    type: string
    required: false
    label:
      en_US: Page ranges
      ja_JP: ページ範囲
    human_description:
      en_US: "Optional comma-separated 1-based page ranges, e.g. '1-10, 11-20, 21-50' or '5, 7-9'. Each range is analyzed separately and returned as one element of the segments list. Ranges must be in ascending order by first page; overlaps are allowed; at most 20 ranges. Leave empty to analyze the whole document."
      ja_JP: "カンマ区切りの1から始まるページ範囲（任意）。例: '1-10, 11-20, 21-50' や '5, 7-9'。各範囲は個別に解析され、segments リストの1要素として返されます。範囲は開始ページの昇順で指定し、重複は許可されます。最大20範囲。空欄の場合はドキュメント全体を解析します。"
    llm_description: "Optional comma-separated 1-based page ranges such as '1-10, 11-20'. Each item is a page number or 'first-last'. Ranges must be in ascending order by first page, may overlap, and at most 20 are allowed. Each range is returned as a separate segment."
    form: llm
  - name: remove_page_headers
    type: boolean
    required: false
    default: false
    label:
      en_US: Remove page headers
      ja_JP: ページヘッダーを削除
    human_description:
      en_US: Remove Markdown lines containing Azure PageHeader comments. Disabled by default.
      ja_JP: Azure の PageHeader コメントを含む Markdown 行を削除します。既定では無効です。
    llm_description: Whether to remove Markdown lines containing Azure PageHeader comments.
    form: form
output_schema:
  type: object
  properties:
    segments:
      type: array
      description: One element per requested page range, in input order. Only set when page ranges are provided.
      items:
        type: object
        properties:
          first_page:
            type: integer
          last_page:
            type: integer
          content:
            type: string
extra:
  python:
    source: tools/extract_document.py
