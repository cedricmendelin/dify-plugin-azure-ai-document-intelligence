identity:
  author: cedricmendelin
  name: azure_ai_document_intelligence
  label:
    en_US: Azure AI Document Intelligence
  description:
    en_US: Accelerate information extraction from documents.
    ja_JP: ドキュメントからテキストと構造を抽出
  icon: 00819-icon-service-Form-Recognizers.svg
  tags:
    - utilities
    - image
credentials_for_provider:
  api_endpoint:
    type: text-input
    required: true
    label:
      en_US: API Endpoint
      ja_JP: APIエンドポイント
    placeholder:
      en_US: Enter your API Endpoint
      ja_JP: APIエンドポイントを入力
    url: https://portal.azure.com  
  api_key:
    type: secret-input
    required: true
    label:
      en_US: API Key
      ja_JP: APIキー
    placeholder:
      en_US: Enter your API Key
      ja_JP: APIキーを入力
    url: https://portal.azure.com
  api_version:
    type: text-input
    required: false
    default: "2024-11-30"
    label:
      en_US: API Version
      ja_JP: APIバージョン
    placeholder:
      en_US: "2024-11-30"
      ja_JP: "2024-11-30"
    help:
      en_US: Must be supported by the installed Azure AI Document Intelligence SDK.
      ja_JP: インストール済み Azure AI Document Intelligence SDK が対応するバージョンを指定してください。
tools:
  - tools/extract_document.yaml
extra:
  python:
    source: provider/azure_ai_document_intelligence.py
