identity:
  name: extract_document
  author: fujita-h
  label:
    en_US: Extract Document
    ja_JP: ドキュメントの展開
description:
  human:
    en_US: Extract Document/Image File to Text/Markdown
    ja_JP: ドキュメント/画像をテキストまたはMarkdownに展開
  llm: This tool extract document or image file to text or markdown format.
parameters:
  - name: input_file
    type: file
    required: true
    label:
      en_US: Document/Image File
      ja_JP: ドキュメント/画像ファイル
    human_description:
      en_US: The document/image file to extract. Supported file type is PDF, JPEG, JPG, PNG, BMP, TIFF, HEIF, DOCX, XLSX, PPTX, HTML.
      ja_JP: 展開するドキュメント/画像ファイル。対応形式は PDF, JPEG, JPG, PNG, BMP, TIFF, HEIF, DOCX, XLSX, PPTX, HTML です。
    llm_description: The document/image file to extract. Supported file type is PDF, JPEG, JPG, PNG, BMP, TIFF, HEIF, DOCX, XLSX, PPTX, HTML.
    form: llm
  - name: output_format
    type: select
    required: true
    label:
      en_US: Output format
      ja_JP: 出力フォーマット
    human_description:
      en_US: Select output format.
      ja_JP: 出力フォーマットを選択します。
    llm_description: Output format. Select text or markdown.
    form: form
    options:
      - value: text
        label:
          en_US: Text
          ja_JP: テキスト
      - value: markdown
        label:
          en_US: Markdown
          ja_JP: Markdown
    default: text
  - name: first_page
    type: number
    required: false
    min: 1
    label:
      en_US: First page
      ja_JP: 開始ページ
    human_description:
      en_US: First 1-based page to analyze. If last page is omitted, only this page is analyzed.
      ja_JP: 解析する最初のページ（1から開始）。終了ページを省略すると、このページのみを解析します。
    llm_description: Optional first 1-based page to analyze.
    form: form
  - name: last_page
    type: number
    required: false
    min: 1
    label:
      en_US: Last page
      ja_JP: 終了ページ
    human_description:
      en_US: Last 1-based page to analyze. If first page is omitted, analysis starts at page 1.
      ja_JP: 解析する最後のページ（1から開始）。開始ページを省略すると、1ページ目から解析します。
    llm_description: Optional last 1-based page to analyze.
    form: form
  - name: remove_page_headers
    type: boolean
    required: false
    default: false
    label:
      en_US: Remove page headers
      ja_JP: ページヘッダーを削除
    human_description:
      en_US: Remove Markdown lines containing Azure PageHeader comments. Disabled by default.
      ja_JP: Azure の PageHeader コメントを含む Markdown 行を削除します。既定では無効です。
    llm_description: Whether to remove Markdown lines containing Azure PageHeader comments.
    form: form
extra:
  python:
    source: tools/extract_document.py
